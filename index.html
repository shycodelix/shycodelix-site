<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shycodelix</title>
    <meta
      name="description"
      content="Esports operations, content creation and customer experience. Philippines."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3efe7;
        --ink: #14110d;
        --muted: #4a443b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14110d;
          --ink: #f3efe7;
          --muted: #b8b0a4;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-wrap: pretty;
      }
      main {
        max-width: 33rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 9vw, 3rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 0.85rem;
        color: var(--muted);
      }
      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }
    </style>
  </head>
  <body>
    <!--
      Publishing marker, deliberately at the top level.

      The site itself is the Next.js app in app/ and components/, built with
      `npm run build` (next.config.mjs sets output: "export"), which writes the
      finished static site to out/. Hosts that publish a build-step site look for
      index.html at the repository root and then serve what the build wrote; this
      file is what they find, and the exported out/index.html is the reader.

      It is also a real, self-contained page, so the repository viewed on its own
      (or served without the build having run) still explains itself instead of
      showing a blank 404.
    -->
    <main>
      <h1>shycodelix</h1>
      <p>Esports operations, content creation and customer experience. Philippines.</p>
      <p>
        The site is a Next.js static export &mdash; build it with
        <code>npm run build</code> and the reader, the lab and the links page
        land in <code>out/</code>.
      </p>
      <p>
        <a href="https://shy-jble.freemilk.app">shy-jble.freemilk.app</a>
      </p>
    </main>
  </body>
</html>
